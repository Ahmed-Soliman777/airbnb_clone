<div class="flex min-h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-lg flex flex-col">
    <!-- Title -->
    <div class="p-6 border-b">
      <h1 class="text-2xl font-bold text-gray-800">Admin Dashboard</h1>
    </div>

    <!-- Welcome Message -->
    <div class="p-6 flex-1">
      <p class="text-lg text-gray-700">
        Welcome, <span class="font-semibold text-indigo-600">{{ user?.firstName }}</span>
      </p>
    </div>

    <!-- Logout Button -->
    <div class="p-6 border-t">
      <button
        (click)="logout()"
        class="w-full cursor-pointer px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
      >
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-8">
    <div class="max-w-4xl bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">User Information</h2>

      @if (user) {
      <div class="space-y-4">
        <div class="p-4 bg-gray-50 rounded-lg">
          <p class="text-lg">
            <span class="font-semibold">Name:</span> {{ user.firstName }} {{ user.lastName }}
          </p>
          <p class="text-lg"><span class="font-semibold">Email:</span> {{ user.email }}</p>
          <p class="text-lg">
            <span class="font-semibold">Role:</span>
            <span class="text-indigo-600 font-bold">{{ user.role }}</span>
          </p>
        </div>
      </div>
      }
    </div>
  </main>
</div>
