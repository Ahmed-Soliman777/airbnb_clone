<aside class="w-64 h-screen bg-white shadow-lg flex flex-col">
  <!-- Title -->
  <div class="p-6 border-b">
    <h1 class="text-2xl font-bold text-gray-800">Admin Dashboard</h1>
  </div>

  <!-- Welcome Message -->
  <div class="p-6 flex-1">
    <p class="text-lg text-gray-700">
      Welcome, <span class="font-semibold text-indigo-600">{{ user?.firstName }}</span>
    </p>
  </div>

  <!-- Logout Button -->
  <div class="p-6 border-t">
    <button
      (click)="onLogout()"
      class="w-full cursor-pointer px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
    >
      Logout
    </button>
  </div>
</aside>
