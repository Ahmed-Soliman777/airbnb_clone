<aside class="w-64 h-screen bg-white shadow-lg flex flex-col">
  <!-- Title -->
  <div class="flex items-center p-6 border-b">
    <img src="airbnb-logo.png" alt="airbnb logo" class="w-8 h-8 mr-2" />
    <h1 class="text-lg font-medium text-gray-800">
      <span class="text-[#ff5c61]">airbnb</span>Admin
    </h1>
  </div>

  <!-- Welcome Message -->
  <div class="p-6 flex-1">
    <p class="text-lg text-gray-700">
      Welcome, <span class="font-semibold text-primary">{{ user?.firstName }}</span>
    </p>
  </div>

  <!-- Logout Button -->
  <div class="p-6 border-t">
    <button
      (click)="onLogout()"
      class="w-full cursor-pointer px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
    >
      Logout
    </button>
  </div>
</aside>
