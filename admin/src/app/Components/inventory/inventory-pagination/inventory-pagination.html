<div class="bg-white rounded-xl shadow-sm border border-gray-100 mt-6 px-6 py-4">
  <div class="flex items-center justify-between">
    <div class="text-sm text-gray-600">
      Showing {{ paginationStart }} to {{ paginationEnd }} of {{ totalItems }} listings
    </div>
    <div class="flex items-center gap-2">
      <button
        class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        (click)="previousPage()"
        [disabled]="currentPage === 1"
      >
        <mat-icon class="w-5 h-5">chevron_left</mat-icon>
      </button>

      <div class="flex items-center gap-1">
        <button
          *ngFor="let page of getPaginationPages()"
          class="min-w-9 h-9 px-3 text-sm font-medium rounded-lg transition-colors"
          [class.bg-red-500]="currentPage === page"
          [class.text-white]="currentPage === page"
          [class.text-gray-600]="currentPage !== page"
          [class.hover:bg-gray-100]="currentPage !== page"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>

        @if( totalPages > 5 && currentPage > 3) {
        <span class="px-2 text-gray-400">...</span>
        } @else if (totalPages > 5 && currentPage < totalPages - 2) {
        <button
          class="min-w-9 h-9 px-3 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
          (click)="goToPage(totalPages)"
        >
          {{ totalPages }}</button
        >}
      </div>

      <button
        class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
      >
        <mat-icon class="w-5 h-5">chevron_right</mat-icon>
      </button>
    </div>
  </div>
</div>
