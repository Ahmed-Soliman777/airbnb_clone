<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto bg-black/50 backdrop-blur-sm">
  <div class="flex min-h-full items-center justify-center p-4">
    <div class="relative w-full max-w-4xl bg-white rounded-2xl shadow-xl">
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h2 class="text-xl font-bold text-gray-900">
          {{ isEditMode ? 'Edit Listing' : 'Add New Listing' }}
        </h2>
        <button
          class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
          (click)="closeModal()"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="px-6 py-4 max-h-[70vh] overflow-y-auto">
        <div
          *ngIf="errorMessage"
          class="mb-4 p-4 bg-red-50 border border-red-200 text-red-800 rounded-lg"
        >
          {{ errorMessage }}
        </div>

        <form class="space-y-6">
          <!-- Title -->
          <div>
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Title</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">English *</label>
                <input
                  type="text"
                  [(ngModel)]="formData.title.en"
                  name="titleEn"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  required
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Arabic *</label>
                <input
                  type="text"
                  [(ngModel)]="formData.title.ar"
                  name="titleAr"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  required
                />
              </div>
            </div>
          </div>

          <!-- Description -->
          <div>
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Description</h3>
            <div class="grid grid-cols-1 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">English *</label>
                <textarea
                  [(ngModel)]="formData.description.en"
                  name="descEn"
                  rows="3"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  required
                ></textarea>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Arabic *</label>
                <textarea
                  [(ngModel)]="formData.description.ar"
                  name="descAr"
                  rows="3"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  required
                ></textarea>
              </div>
            </div>
          </div>

          <!-- Property Details -->
          <div>
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Property Details</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Property Type *</label>
                <select
                  [(ngModel)]="formData.propertyType"
                  name="propertyType"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  required
                >
                  <option *ngFor="let type of propertyTypes" [value]="type">
                    {{ getPropertyTypeLabel(type) }}
                  </option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2"
                  >Price per Night *</label
                >
                <input
                  type="number"
                  [(ngModel)]="formData.pricePerNight"
                  name="price"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  min="0"
                  required
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Cleaning Fee</label>
                <input
                  type="number"
                  [(ngModel)]="formData.cleaningFee"
                  name="cleaningFee"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  min="0"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Max Guests *</label>
                <input
                  type="number"
                  [(ngModel)]="formData.maxGuests"
                  name="maxGuests"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  min="1"
                  required
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Bedrooms</label>
                <input
                  type="number"
                  [(ngModel)]="formData.bedrooms"
                  name="bedrooms"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  min="0"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Bathrooms</label>
                <input
                  type="number"
                  [(ngModel)]="formData.bathrooms"
                  name="bathrooms"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  min="0"
                />
              </div>
            </div>
          </div>

          <!-- Address -->
          <div>
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Address</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Street</label>
                <input
                  type="text"
                  [(ngModel)]="formData.address.street"
                  name="street"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
                <input
                  type="text"
                  [(ngModel)]="formData.address.city"
                  name="city"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Country</label>
                <input
                  type="text"
                  [(ngModel)]="formData.address.country"
                  name="country"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Latitude</label>
                <input
                  type="number"
                  [(ngModel)]="formData.address.coordinates.lat"
                  name="lat"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  step="0.000001"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Longitude</label>
                <input
                  type="number"
                  [(ngModel)]="formData.address.coordinates.lng"
                  name="lng"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                  step="0.000001"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Host ID</label>
                <input
                  type="text"
                  [(ngModel)]="formData.hostId"
                  name="hostId"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none transition-all"
                />
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200">
        <button
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
          (click)="closeModal()"
        >
          Cancel
        </button>
        <button
          class="px-4 py-2 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600 transition-colors"
          (click)="saveListing()"
        >
          {{ isEditMode ? 'Update Listing' : 'Create Listing' }}
        </button>
      </div>
    </div>
  </div>
</div>
