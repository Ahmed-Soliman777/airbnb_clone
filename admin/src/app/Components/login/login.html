<div class="min-h-screen grid lg:grid-cols-2">
  <!-- Left Side - Login Form with Gradient Background -->
  <div
    class="relative bg-gradient-to-br bg-gradient-to-r from-[#FF385C] via-rose-500 to-pink-600 overflow-hidden flex items-center justify-center px-4 py-12"
  >
    <!-- Dark Overlay for better contrast -->
    <div class="absolute inset-0 bg-black/30"></div>

    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-[0.05]">
      <div
        class="absolute inset-0"
        style="
          background-image: url('data:image/svg+xml,%3Csvg width=%22120%22 height=%2260%22 viewBox=%220 0 120 60%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cpath d=%22M0 30 Q30 26 60 30 T120 30%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.25%22 stroke-width=%220.7%22/%3E%3C/svg%3E');
        "
      ></div>
    </div>

    <!-- Login Content -->
    <div class="relative z-10 w-full max-w-md">
      <!-- Logo -->
      <div class="flex flex-col items-center justify-center space-x-3 mb-8">
        <img src="airbnb-white-logo.png" alt="Logo" class="w-50 mb-12" />
        <p class="text-3xl font-bold text-white">Admin Dashboard</p>
      </div>

      <!-- Welcome Text -->
      <div class="text-center mb-8">
        <p class="text-white/90 text-lg">Sign in to your admin account</p>
      </div>

      <!-- Login Card -->
      <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8">
        <!-- Error Message -->
        @if(errorMessage ){
        <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-lg">
          <div class="flex items-center">
            <svg
              class="w-5 h-5 text-red-500 mr-2 flex-shrink-0"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                clip-rule="evenodd"
              ></path>
            </svg>
            <span class="text-red-800 text-sm font-medium">{{ errorMessage }}</span>
          </div>
        </div>
        }

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- Email -->
          <div>
            <label class="block text-sm font-semibold text-gray-800 mb-2"> Email address </label>
            <input
              type="email"
              formControlName="email"
              placeholder="you@example.com"
              class="w-full px-4 py-3.5 text-gray-900 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition-all duration-200 placeholder:text-gray-400"
              [class.border-red-400]="email?.invalid && email?.touched"
              [class.focus:ring-red-500]="email?.invalid && email?.touched"
            />
          </div>

          <!-- Password -->
          <div>
            <label class="block text-sm font-semibold text-gray-800 mb-2"> Password </label>
            <input
              type="password"
              formControlName="password"
              placeholder="Enter your password"
              class="w-full px-4 py-3.5 text-gray-900 bg-white border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition-all duration-200 placeholder:text-gray-400"
              [class.border-red-400]="password?.invalid && password?.touched"
              [class.focus:ring-red-500]="password?.invalid && password?.touched"
            />
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="isLoading || loginForm.invalid"
            class="w-full bg-gradient-to-r from-gray-900 to-gray-800 text-white py-3.5 rounded-xl font-semibold text-base hover:from-gray-800 hover:to-gray-700 transform hover:scale-[1.02] transition-all duration-200 shadow-lg disabled:from-gray-400 disabled:to-gray-400 disabled:cursor-not-allowed disabled:transform-none"
          >
            @if (isLoading) {
            <span>Signing in...</span>
            } @else {
            <span>Sign in</span>
            }
          </button>
        </form>

        <!-- Footer -->
        <div class="mt-6 text-center">
          <p class="text-xs text-gray-500">Secured admin access · Protected by encryption</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side - Image Placeholder -->
  <div class="hidden lg:block relative bg-gray-100 overflow-hidden">
    <div class="absolute inset-0 flex items-center justify-center">
      <img src="hero-login-admin-dashboard.webp" alt="" />
    </div>
  </div>
</div>
